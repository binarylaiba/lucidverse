<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03050c;
    }
</style>
</head>
<body>
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(65, width / height, 0.1, 1000);
  camera.position.z = 6.5;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0x303550, 1.8);
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(0x7c3aed, 4.5, 60);
  pointLight.position.set(6, 4, 6);
  scene.add(pointLight);

  const cyanLight = new THREE.PointLight(0x44e2cd, 3.5, 60);
  cyanLight.position.set(-6, -4, 5);
  scene.add(cyanLight);

  const crystalsGroup = new THREE.Group();
  scene.add(crystalsGroup);

  const octaGeo = new THREE.OctahedronGeometry(1, 0);
  const icosaGeo = new THREE.IcosahedronGeometry(0.8, 0);
  const tetraGeo = new THREE.TetrahedronGeometry(1.2, 0);

  const crystalMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      emissive: 0x1a1235,
      roughness: 0.1,
      metalness: 0.1,
      transmission: 0.6,
      ior: 1.5,
      reflectivity: 0.9,
      transparent: true,
      opacity: 0.85,
      flatShading: true
  });

  const numCrystals = 18;
  for (let i = 0; i < numCrystals; i++) {
      const geo = i % 3 === 0 ? octaGeo : (i % 3 === 1 ? icosaGeo : tetraGeo);
      const mesh = new THREE.Mesh(geo, crystalMat.clone());

      mesh.position.x = (Math.random() - 0.5) * 16;
      mesh.position.y = (Math.random() - 0.5) * 10;
      mesh.position.z = (Math.random() - 0.5) * 6 - 1;

      const scale = 0.25 + Math.random() * 0.55;
      mesh.scale.set(scale, scale * (1.2 + Math.random() * 0.6), scale);

      mesh.rotation.x = Math.random() * Math.PI * 2;
      mesh.rotation.y = Math.random() * Math.PI * 2;
      mesh.rotation.z = Math.random() * Math.PI * 2;

      mesh.userData = {
          baseY: mesh.position.y,
          speed: 0.004 + Math.random() * 0.008,
          rotSpeedX: (Math.random() - 0.5) * 0.015,
          rotSpeedY: (Math.random() - 0.5) * 0.02,
          floatOffset: Math.random() * Math.PI * 2
      };

      if (i % 2 === 0) {
          const wireGeo = new THREE.WireframeGeometry(geo);
          const wireMat = new THREE.LineBasicMaterial({ color: 0x44e2cd, transparent: true, opacity: 0.35 });
          const wireMesh = new THREE.LineSegments(wireGeo, wireMat);
          mesh.add(wireMesh);
      }

      crystalsGroup.add(mesh);
  }

  const particlesCount = 450;
  const posArray = new Float32Array(particlesCount * 3);
  const colorArray = new Float32Array(particlesCount * 3);

  for (let i = 0; i < particlesCount; i++) {
      posArray[i * 3] = (Math.random() - 0.5) * 24;
      posArray[i * 3 + 1] = (Math.random() - 0.5) * 16;
      posArray[i * 3 + 2] = (Math.random() - 0.5) * 12;

      if (i % 3 === 0) {
          colorArray[i * 3] = 0.27; colorArray[i * 3 + 1] = 0.88; colorArray[i * 3 + 2] = 0.8;
      } else if (i % 3 === 1) {
          colorArray[i * 3] = 0.82; colorArray[i * 3 + 1] = 0.73; colorArray[i * 3 + 2] = 1.0;
      } else {
          colorArray[i * 3] = 1.0; colorArray[i * 3 + 1] = 1.0; colorArray[i * 3 + 2] = 1.0;
      }
  }

  const particlesGeometry = new THREE.BufferGeometry();
  particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

  const particlesMaterial = new THREE.PointsMaterial({
      size: 0.045,
      vertexColors: true,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending
  });

  const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
  scene.add(particlesMesh);

  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.001;

      camera.position.x += (mouseX * 0.8 - camera.position.x) * 0.05;
      camera.position.y += (-mouseY * 0.6 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);

      crystalsGroup.children.forEach(c => {
          c.rotation.x += c.userData.rotSpeedX;
          c.rotation.y += c.userData.rotSpeedY;
          c.position.y = c.userData.baseY + Math.sin(time * 1.2 + c.userData.floatOffset) * 0.25;
      });

      particlesMesh.rotation.y = time * 0.02;

      renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
  });

  animate();
})();
</script>
</div>
</body>
</html>
